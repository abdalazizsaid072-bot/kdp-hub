<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KDP Hub — إدارة أعمال النشر</title>
  <meta name="description" content="لوحة تحكم لأعمال النشر على أمازون كيندل: العملاء، الترجمة والتنسيق، الأغلفة وتصميمات 3D، إعلانات Amazon Ads والتحليلات.">
  <meta name="theme-color" content="#0e0c1d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KDP Hub">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>

  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/home">
      <img src="icons/icon.svg" alt="" width="40" height="40">
      <div><b>KDP Hub</b><small>إدارة أعمال النشر</small></div>
    </a>
    <nav id="sideNav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="top-title" id="topTitle"></div>
      <div class="top-actions">
        <button class="icon-btn" id="syncBtn" title="تحديث من الشيت" aria-label="تحديث"><i data-lucide="refresh-cw"></i></button>
        <button class="icon-btn" id="bellBtn" title="الإشعارات" aria-label="الإشعارات"><i data-lucide="bell"></i><span class="dot" id="bellDot" hidden></span></button>
        <button class="icon-btn" id="themeBtn" title="الوضع الليلي/النهاري" aria-label="تغيير الثيم"><i data-lucide="moon-star"></i></button>
        <button class="btn primary add-btn" id="addBtn"><i data-lucide="plus"></i><span>إضافة</span></button>
      </div>
    </header>
    <div id="banner"></div>
    <section id="view" class="view" tabindex="-1"></section>
  </main>

  <nav class="bottom-nav" id="bottomNav"></nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
